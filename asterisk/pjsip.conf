; ==============================================================================
; Asterisk PJSIP Configuration for JioFiber Global PBX Gateway
; https://github.com/musabtvt/jiofiber-asterisk-global-pbx
; ==============================================================================

[global]
type=global
user_agent=JIDU6401/JUICEJFV-1.4.11
endpoint_identifier_order=username,ip

; ------------------------------------------------------------------------------
; Transports: UDP, TCP, and TLS
; ------------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.10.10.0/24
local_net=192.168.1.0/24
local_net=127.0.0.0/8

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=10.10.10.0/24
local_net=192.168.1.0/24
local_net=127.0.0.0/8

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
verify_server=no
verify_client=no
local_net=10.10.10.0/24
local_net=192.168.1.0/24
local_net=127.0.0.0/8

; ------------------------------------------------------------------------------
; Client Endpoint 1001 (Smartphone: iOS / Android Linphone)
; ------------------------------------------------------------------------------
[1001]
type=endpoint
context=from-phones
disallow=all
allow=alaw,ulaw,opus,g722
auth=auth1001
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
dtmf_mode=rfc4733

[auth1001]
type=auth
auth_type=userpass
username=1001
password=ChangeThisSecretKey123!

[1001]
type=aor
max_contacts=5
qualify_frequency=30
qualify_timeout=3

; ------------------------------------------------------------------------------
; Client Endpoint 1002 (Laptop / MicroSIP / Desk Phone)
; ------------------------------------------------------------------------------
[1002]
type=endpoint
context=from-phones
disallow=all
allow=alaw,ulaw,opus,g722
auth=auth1002
aors=1002
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
dtmf_mode=rfc4733

[auth1002]
type=auth
auth_type=userpass
username=1002
password=ChangeThisSecondSecretKey456!

[1002]
type=aor
max_contacts=5
qualify_frequency=30
qualify_timeout=3

; ------------------------------------------------------------------------------
; Trunk to OpenWrt Router Jio IMS Bridge (over WireGuard / SSH Tunnel: 10.10.10.2)
; ------------------------------------------------------------------------------
; Note: For JioFiber FTTH use port 5060 with transport-udp.
;       For Jio AirFiber 5G use port 5068 with transport-tls and +sip.instance.
[jio-trunk]
type=endpoint
context=from-jio
transport=transport-tls
disallow=all
allow=alaw,ulaw
aors=jio-trunk-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
outbound_proxy=sip:10.10.10.2:5068\;transport=tls\;lr
contact_header_params=+sip.instance="<urn:uuid:00000000-0000-1000-8000-020000112233>"

[jio-trunk-aor]
type=aor
contact=sip:10.10.10.2:5068\;transport=tls
qualify_frequency=30
